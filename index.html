  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #1f1f2e;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      padding: 30px;
      width: 100%;
      max-width: 550px;
      text-align: center;
      animation: fadeIn 1s ease;
    }

    h1 {
      color: #4caf50;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 1rem;
      border: 1px solid #444;
      border-radius: 5px;
      background: #2a2a3d;
      color: #fff;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .search-btn {
      background: #4caf50;
      color: white;
    }

    .clear-btn {
      background: #ff5252;
      color: white;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #222;
      border-radius: 8px;
      display: none;
    }

    .passport-photo {
      margin-top: 10px;
      max-width: 100px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>DOB Finder</h1>
    <label for="dob">Enter DOB (dd/mm/yyyy):</label>
    <input type="text" id="dob" placeholder="DD/MM/YYYY" maxlength="10" oninput="formatDOB(this)" onkeydown="checkEnter(event)">
    <div class="buttons">
      <button class="search-btn" onclick="fetchData()">Search</button>
      <button class="clear-btn" onclick="clearResult()">Clear</button>
    </div>
    <div id="result"></div>
  </div>

    function fetchData() {
      const dob = document.getElementById("dob").value.trim();
      const result = document.getElementById("result");

      if (data[dob]) {
        const { name, location, father_name, mother_name, gender, mobile, signature, photo } = data[dob];
        result.style.display = "block";
        result.innerHTML = `
          <strong>Assalamualaikum! 

This website is designed by 
-Syed Abdul Hakeem.</strong><br><br>
          <div><strong>Name:</strong> ${name}</div>
          <div><strong>Location:</strong> ${location}</div>
          ${father_name ? `<div><strong>Father's Name:</strong> ${father_name}</div>` : ""}
          ${mother_name ? `<div><strong>Mother's Name:</strong> ${mother_name}</div>` : ""}
          ${gender ? `<div><strong>Gender:</strong> ${gender}</div>` : ""}
          ${mobile ? `<div><strong>Mobile:</strong> ${mobile}</div>` : ""}
          ${signature ? `<div><strong>Signature:</strong> ${signature}</div>` : ""}
          ${photo ? `<img src="${photo}" alt="Passport Photo" class="passport-photo">` : ""}
        `;
      } else {
        result.style.display = "block";
        result.innerHTML = `<strong style="color: #ff5c5c;">No record found for the entered DOB.</strong>`;
      }
    }

    function checkEnter(event) {
      if (event.key === "Enter") fetchData();
    }

    function clearResult() {
      document.getElementById("dob").value = "";
      const result = document.getElementById("result");
      result.innerHTML = "";
      result.style.display = "none";
    }

    function formatDOB(input) {
      let value = input.value.replace(/\D/g, "").slice(0, 8);
      if (value.length >= 5) {
        input.value = `${value.slice(0,2)}/${value.slice(2,4)}/${value.slice(4)}`;
      } else if (value.length >= 3) {
        input.value = `${value.slice(0,2)}/${value.slice(2)}`;
      } else {
        input.value = value;
      }
    }
